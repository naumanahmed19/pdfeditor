name: Release applications

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Upload to stores and publish the GitHub release
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: application-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify release version
    runs-on: ubuntu-22.04
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release version
        id: version
        shell: pwsh
        run: |
          $appVersion = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $packageVersion = (Get-Content "package.json" -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path "src-tauri/Cargo.toml" -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value

          if ($packageVersion -ne $appVersion -or $cargoVersion -ne $appVersion) {
            throw "Version mismatch: Tauri=$appVersion, package.json=$packageVersion, Cargo.toml=$cargoVersion."
          }

          $releaseTag = if ("${{ github.event_name }}" -eq "push") {
            "${{ github.ref_name }}"
          }
          else {
            "v$appVersion"
          }

          if ($releaseTag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH format. Received: $releaseTag"
          }

          if ($releaseTag.Substring(1) -ne $appVersion) {
            throw "Tag $releaseTag does not match the application version $appVersion."
          }

          if (
            "${{ github.event_name }}" -eq "workflow_dispatch" -and
            "${{ inputs.publish_release }}" -eq "true"
          ) {
            $existingTagCommit = git rev-list -n 1 $releaseTag 2>$null
            if ($LASTEXITCODE -ne 0) {
              # A first release has no tag yet. Reset the native exit code so
              # GitHub's PowerShell wrapper does not fail after this script.
              $existingTagCommit = $null
              $global:LASTEXITCODE = 0
            }
            if ($existingTagCommit -and $existingTagCommit -ne "${{ github.sha }}") {
              throw "Tag $releaseTag already points to $existingTagCommit, not the selected commit ${{ github.sha }}."
            }
          }

          "app_version=$appVersion" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT

  test:
    name: Test application
    needs: prepare
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Test
        run: bun run test

  windows:
    name: Build Windows Store package
    needs: [prepare, test]
    if: github.event_name == 'push' || inputs.publish_release
    runs-on: windows-2022

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Microsoft Store upload
        run: bun run msix:store

      - name: Verify package and create checksum
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.app_version }}.0"
          $package = "src-tauri/target/msix/PickPDF_${version}_x64.msixupload"

          if (-not (Test-Path -LiteralPath $package)) {
            throw "Expected Store upload package was not created: $package"
          }

          $entries = tar -tf $package
          if ($entries -notcontains "PickPDF_${version}_x64.msix") {
            throw "The upload container does not include the expected MSIX package."
          }
          if ($entries -notcontains "PickPDF.appxsym") {
            throw "The upload container does not include release symbols."
          }

          New-Item -ItemType Directory -Path "release-artifacts" -Force | Out-Null
          Copy-Item -LiteralPath $package -Destination "release-artifacts"
          $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $package)" | Set-Content -LiteralPath "release-artifacts/SHA256SUMS-windows-x64.txt" -Encoding ascii

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Build Linux packages
    needs: [prepare, test]
    if: github.event_name == 'push' || inputs.publish_release
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build AppImage and Debian package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_ENABLE_UPDATER: "true"
        run: bun run tauri build --ci --bundles appimage,deb

      - name: Collect Linux artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          mapfile -t packages < <(find src-tauri/target/release/bundle -maxdepth 2 -type f \( -name '*.AppImage' -o -name '*.AppImage.sig' -o -name '*.deb' \))

          if [[ ${#packages[@]} -ne 3 ]]; then
            printf 'Expected an AppImage, its signature, and one Debian package; found %s\n' "${#packages[@]}"
            printf '%s\n' "${packages[@]}"
            exit 1
          fi

          cp "${packages[@]}" release-artifacts/
          (cd release-artifacts && sha256sum *.AppImage *.deb > SHA256SUMS-linux-x64.txt)

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

  macos:
    name: Build universal macOS package
    needs: [prepare, test]
    if: github.event_name == 'push' || inputs.publish_release
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build universal DMG
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_ENABLE_UPDATER: "true"
        run: bun run tauri build --ci --target universal-apple-darwin --bundles app,dmg

      - name: Collect macOS artifact
        shell: bash
        run: |
          mkdir -p release-artifacts
          shopt -s nullglob
          packages=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)

          if [[ ${#packages[@]} -ne 1 ]]; then
            printf 'Expected one universal DMG; found %s\n' "${#packages[@]}"
            printf '%s\n' "${packages[@]}"
            exit 1
          fi

          cp "${packages[0]}" release-artifacts/
          updater_bundles=(src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz)

          if [[ ${#updater_bundles[@]} -ne 1 || ! -f "${updater_bundles[0]}.sig" ]]; then
            echo "Expected one universal macOS updater bundle and signature."
            exit 1
          fi

          cp "${updater_bundles[0]}" "${updater_bundles[0]}.sig" release-artifacts/
          (cd release-artifacts && shasum -a 256 *.dmg > SHA256SUMS-macos-universal.txt)

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-universal
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

  macos_app_store:
    name: Sign and upload Mac App Store package
    needs: [prepare, test]
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Apple secrets
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          APPLE_APP_CERTIFICATE_BASE64: ${{ secrets.APPLE_APP_CERTIFICATE_BASE64 }}
          APPLE_APP_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_APP_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          required=(
            APPLE_API_ISSUER
            APPLE_API_KEY_ID
            APPLE_API_PRIVATE_KEY_BASE64
            APPLE_APP_CERTIFICATE_BASE64
            APPLE_APP_CERTIFICATE_PASSWORD
            APPLE_INSTALLER_CERTIFICATE_BASE64
            APPLE_INSTALLER_CERTIFICATE_PASSWORD
            APPLE_KEYCHAIN_PASSWORD
            APPLE_PROVISIONING_PROFILE_BASE64
            APPLE_TEAM_ID
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required repository secret is missing or empty: $name"
              exit 1
            fi
          done

          if [[ "$APPLE_TEAM_ID" != "X9DX8SWR84" ]]; then
            echo "APPLE_TEAM_ID does not match the App ID and entitlements."
            exit 1
          fi

      - name: Import Apple signing certificates
        shell: bash
        env:
          APPLE_APP_CERTIFICATE_BASE64: ${{ secrets.APPLE_APP_CERTIFICATE_BASE64 }}
          APPLE_APP_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_APP_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          app_certificate="$RUNNER_TEMP/pickpdf-apple-distribution.p12"
          installer_certificate="$RUNNER_TEMP/pickpdf-installer-distribution.p12"
          keychain_path="$RUNNER_TEMP/pickpdf-signing.keychain-db"

          printf '%s' "$APPLE_APP_CERTIFICATE_BASE64" | base64 --decode > "$app_certificate"
          printf '%s' "$APPLE_INSTALLER_CERTIFICATE_BASE64" | base64 --decode > "$installer_certificate"

          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$app_certificate" \
            -P "$APPLE_APP_CERTIFICATE_PASSWORD" \
            -A -k "$keychain_path"
          security import "$installer_certificate" \
            -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" \
            -A -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"

          existing_keychains=$(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "$keychain_path" $existing_keychains

          app_identity=$(security find-identity -v -p codesigning "$keychain_path" \
            | awk -F'"' '/Apple Distribution:/{print $2; exit}')
          installer_identity=$(security find-certificate -a \
            -c "3rd Party Mac Developer Installer" -Z "$keychain_path" \
            | awk '/SHA-1 hash:/{print $3; exit}')

          if [[ -z "$app_identity" ]]; then
            echo "The app P12 does not contain an Apple Distribution identity and private key."
            exit 1
          fi
          if [[ -z "$installer_identity" ]]; then
            echo "The installer P12 does not contain a 3rd Party Mac Developer Installer certificate."
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$app_identity" >> "$GITHUB_ENV"
          echo "INSTALLER_SIGNING_IDENTITY=$installer_identity" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Install and verify App Store credentials
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          profile_path="src-tauri/PickPDF.provisionprofile"
          profile_plist="$RUNNER_TEMP/pickpdf-profile.plist"
          api_key_dir="$HOME/.appstoreconnect/private_keys"
          api_key_path="$api_key_dir/AuthKey_${APPLE_API_KEY_ID}.p8"

          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"
          mkdir -p "$api_key_dir"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 --decode > "$api_key_path"
          chmod 600 "$api_key_path"

          security cms -D -i "$profile_path" > "$profile_plist"
          profile_team=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")
          profile_app_id=$(/usr/libexec/PlistBuddy \
            -c 'Print :Entitlements:com.apple.application-identifier' "$profile_plist")

          if [[ "$profile_team" != "$APPLE_TEAM_ID" ]]; then
            echo "The provisioning profile belongs to a different Apple team."
            exit 1
          fi
          if [[ "$profile_app_id" != "$APPLE_TEAM_ID.com.xvelopers.pickpdf" ]]; then
            echo "The provisioning profile does not match com.xvelopers.pickpdf."
            exit 1
          fi

      - name: Create App Store build configuration
        shell: bash
        env:
          STORE_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          node -e 'const fs = require("fs"); const source = "src-tauri/tauri.appstore.conf.json"; const target = "src-tauri/tauri.appstore.ci.conf.json"; const config = JSON.parse(fs.readFileSync(source, "utf8")); config.bundle.macOS.bundleVersion = process.env.STORE_BUILD_NUMBER; fs.writeFileSync(target, JSON.stringify(config, null, 2) + "\n");'

      - name: Build signed Mac App Store application
        env:
          VITE_DISTRIBUTION_CHANNEL: mac-app-store
        run: >-
          bun run tauri build --ci
          --target universal-apple-darwin
          --bundles app
          --config src-tauri/tauri.appstore.ci.conf.json

      - name: Verify signed application and create installer package
        shell: bash
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          app_bundle="src-tauri/target/universal-apple-darwin/release/bundle/macos/PickPDF.app"
          signed_entitlements="$RUNNER_TEMP/pickpdf-signed-entitlements.plist"
          package_dir="app-store-artifacts"
          package_path="$package_dir/PickPDF-${APP_VERSION}-macOS-AppStore.pkg"

          if [[ ! -d "$app_bundle" ]]; then
            echo "Expected application bundle was not created: $app_bundle"
            exit 1
          fi
          if [[ ! -f "$app_bundle/Contents/embedded.provisionprofile" ]]; then
            echo "The application does not contain embedded.provisionprofile."
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_bundle"
          codesign -d --entitlements :- "$app_bundle" > "$signed_entitlements"

          signed_app_id=$(/usr/libexec/PlistBuddy \
            -c 'Print :com.apple.application-identifier' "$signed_entitlements")
          signed_sandbox=$(/usr/libexec/PlistBuddy \
            -c 'Print :com.apple.security.app-sandbox' "$signed_entitlements")
          if [[ "$signed_app_id" != "$APPLE_TEAM_ID.com.xvelopers.pickpdf" ]]; then
            echo "The signed application identifier is incorrect."
            exit 1
          fi
          if [[ "$signed_sandbox" != "true" ]]; then
            echo "The signed application is missing App Sandbox."
            exit 1
          fi

          mkdir -p "$package_dir"
          xcrun productbuild \
            --sign "$INSTALLER_SIGNING_IDENTITY" \
            --keychain "$APPLE_SIGNING_KEYCHAIN" \
            --component "$app_bundle" /Applications \
            "$package_path"
          pkgutil --check-signature "$package_path"
          echo "APP_STORE_PACKAGE=$package_path" >> "$GITHUB_ENV"

      - name: Validate package with App Store Connect
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: >-
          xcrun altool --validate-app
          --type macos
          --file "$APP_STORE_PACKAGE"
          --apiKey "$APPLE_API_KEY_ID"
          --apiIssuer "$APPLE_API_ISSUER"

      - name: Keep validated App Store package
        uses: actions/upload-artifact@v4
        with:
          name: app-store-macos-universal
          path: app-store-artifacts/*.pkg
          if-no-files-found: error
          retention-days: 14

      - name: Upload package to App Store Connect
        if: github.event_name == 'push' || inputs.publish_release
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: >-
          xcrun altool --upload-app
          --type macos
          --file "$APP_STORE_PACKAGE"
          --apiKey "$APPLE_API_KEY_ID"
          --apiIssuer "$APPLE_API_ISSUER"

      - name: Remove temporary Apple credentials
        if: always()
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          keychain_path="${APPLE_SIGNING_KEYCHAIN:-$RUNNER_TEMP/pickpdf-signing.keychain-db}"
          if [[ -f "$keychain_path" ]]; then
            security delete-keychain "$keychain_path" || true
          fi
          rm -f \
            "$RUNNER_TEMP/pickpdf-apple-distribution.p12" \
            "$RUNNER_TEMP/pickpdf-installer-distribution.p12" \
            "$RUNNER_TEMP/pickpdf-profile.plist" \
            "$RUNNER_TEMP/pickpdf-signed-entitlements.plist" \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" \
            "src-tauri/PickPDF.provisionprofile" \
            "src-tauri/tauri.appstore.ci.conf.json"

  chrome:
    name: Build Chrome extension
    needs: [prepare, test]
    if: github.event_name == 'push' || inputs.publish_release
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and verify Chrome extension
        run: bun run build:extension

      - name: Package Chrome extension and create checksum
        shell: bash
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
        run: |
          mkdir -p release-artifacts
          package="PickPDF-${APP_VERSION}-chrome.zip"
          (
            cd dist-extension
            find . -type f -exec touch -t 198001010000 {} +
            find . -type f -print | LC_ALL=C sort | zip -X -q "../release-artifacts/${package}" -@
          )

          if [[ ! -s "release-artifacts/${package}" ]]; then
            echo "Chrome extension archive was not created: ${package}"
            exit 1
          fi

          unzip -tq "release-artifacts/${package}"
          (cd release-artifacts && sha256sum "${package}" > SHA256SUMS-chrome.txt)

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-chrome
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: [prepare, windows, linux, macos, chrome]
    if: github.event_name == 'push' || inputs.publish_release
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Create updater manifest
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
        run: node scripts/create-update-manifest.mjs release-artifacts

      - name: Publish update files to Cloudflare R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          if [[ -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY must be configured as repository secrets."
            exit 1
          fi

          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          mkdir -p r2-artifacts
          find release-artifacts -maxdepth 1 -type f \
            \( -name '*.AppImage' -o -name '*.AppImage.sig' -o -name '*.deb' \
               -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \
               -o -name '*-chrome.zip' \
               -o -name 'SHA256SUMS-*.txt' \) \
            -exec cp {} r2-artifacts/ \;

          aws s3 sync r2-artifacts/ "s3://${R2_BUCKET}/releases/${RELEASE_TAG}/" \
            --endpoint-url "$endpoint" \
            --cache-control "public,max-age=31536000,immutable"

          aws s3 cp release-artifacts/latest.json "s3://${R2_BUCKET}/stable/latest.json" \
            --endpoint-url "$endpoint" \
            --content-type "application/json" \
            --cache-control "no-store"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          mapfile -t files < <(find release-artifacts -maxdepth 1 -type f -print | sort)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release artifacts were downloaded."
            exit 1
          fi

          title="PickPDF - PDF Editor $RELEASE_TAG"
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber --repo "${{ github.repository }}"
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --target "${{ github.sha }}" \
              --title "$title" \
              --generate-notes \
              --repo "${{ github.repository }}"
          fi
