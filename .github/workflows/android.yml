name: Verify Android application

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/android.yml"
      - "package.json"
      - "bun.lock"
      - "src/**"
      - "src-tauri/**"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build debug APK
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Rust Android target
        run: rustup target add x86_64-linux-android

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build Android debug APK
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          bun tauri android build --debug --apk --target x86_64

      - name: Keep Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pickpdf-android-x86_64-debug
          path: src-tauri/gen/android/app/build/outputs/apk/x86_64/debug/*.apk
          if-no-files-found: error
